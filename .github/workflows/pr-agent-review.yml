name: PR-Agent manual review

# Add this label to request one review. Pushes do not trigger the backup bot.
on:
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.label.name == 'pr-agent-review' &&
      contains(fromJSON('["Pizeth"]'), github.actor) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check model key is configured
        env:
          HAS_MODEL_KEY: ${{ secrets.PR_AGENT_GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_MODEL_KEY" != 'true' ]; then
            echo '::error::Add the PR_AGENT_GEMINI_API_KEY repository Actions secret.'
            exit 1
          fi

      # No checkout: the reviewer reads the PR through GitHub's API.
      # Pin the runtime itself, not a wrapper that pulls a moving image tag.
      - name: Review with Gemini
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.PR_AGENT_GEMINI_API_KEY }}
          CONFIG.MODEL: gemini/gemini-3.8-flash
          CONFIG.FALLBACK_MODELS: '[]'
          CONFIG.AI_TIMEOUT: '300'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["labeled"]'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
